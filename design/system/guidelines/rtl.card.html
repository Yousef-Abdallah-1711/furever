<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px}</style></head><body class="fe-root"><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div dir="ltr" lang="en" class="fe-card" style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:8px"><span class="fe-icon flip" data-i="arrow-left" style=""></span><b>Book visit</b></div><div style="display:flex;align-items:center;gap:8px"><span class="fe-icon" data-i="phone" style="color:var(--primary)"></span>Call <span class="ltr">+20 100 123 4567</span></div><div style="display:flex;align-items:center;gap:8px"><span class="fe-icon" data-i="circle-check" style="color:var(--success)"></span>Confirmed</div><div class="t-cap">Back arrow flips. Phone and check do not.</div></div><div dir="rtl" lang="ar" class="fe-card" style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:8px"><span class="fe-icon flip" data-i="arrow-left" style=""></span><b>حجز موعد</b></div><div style="display:flex;align-items:center;gap:8px"><span class="fe-icon" data-i="phone" style="color:var(--primary)"></span>اتصل <span class="ltr">+20 100 123 4567</span></div><div style="display:flex;align-items:center;gap:8px"><span class="fe-icon" data-i="circle-check" style="color:var(--success)"></span>تم التأكيد</div><div class="t-cap">السهم يتعكس. التليفون والعلامة لا.</div></div></div><script>document.querySelectorAll("[data-i]").forEach(function(e){fetch("https://unpkg.com/lucide-static@0.469.0/icons/"+e.dataset.i+".svg").then(function(r){return r.text()}).then(function(s){e.innerHTML=s.replace('width="24"','width="100%"').replace('height="24"','height="100%"')})})</script></body></html>
